name: CI

# Docs-only changes run nothing: no test reads these files.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/pull_request_template.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/pull_request_template.md"

# A new push to a pull request cancels its older run. Runs on main get one group per commit, so none is ever
# cancelled or dropped from the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
